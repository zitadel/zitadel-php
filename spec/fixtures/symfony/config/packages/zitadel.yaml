zitadel:
    issuer_url: '%env(ZITADEL_ISSUER_URL)%'
    client_id: '%env(ZITADEL_CLIENT_ID)%'
    redirect_uri: '%env(ZITADEL_REDIRECT_URI)%'
    cookie_secret: '%env(ZITADEL_COOKIE_SECRET)%'
    protect_all: true
    ignored_routes:
        - '/health'
    proxy_path: '/__nextgen'
    jwks_path: '%env(ZITADEL_JWKS_PATH)%'
    authorization_path: '%env(ZITADEL_AUTHORIZATION_PATH)%'
    token_path: '%env(ZITADEL_TOKEN_PATH)%'
    end_session_path: '%env(ZITADEL_END_SESSION_PATH)%'
